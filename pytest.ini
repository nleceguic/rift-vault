[pytest]
testpaths = tests
addopts = -v --tb=short --cov=app --cov-config=pytest.ini --cov-report=term-missing --cov-report=xml

[run]
; app/ui is presentation code (Tkinter/CustomTkinter views, dialogs, widgets)
; with no automated tests today - it needs a live display to exercise
; meaningfully. Everything else (app/core, app/storage, app/hooks, app/config)
; is the testable core and stays fully counted, including untested files
; like error_handler.py and service_registry.py - low coverage there is a
; real gap, not something to hide.
omit =
    app/ui/*

[report]
skip_empty = True
